<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Painel de Acesso</title>

<style>

/* CORES */
:root {
    --reembolso: #2d7ff9;
    --appsheet: #1a73e8;
    --glpi: #008080;
    --pontomais: #00a8a8;
    --card-bg: #ffffff;
}

/* FUNDO */
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f9;
}

/* CONTAINER */
.funnel-container {
    display: flex;
    justify-content: center;
    align-items: stretch;
    flex-wrap: wrap;
    gap: 20px;
    max-width: 1200px;
    margin: 40px auto;
    padding: 0 20px;
}

/* CARD */
.embedded-section {
    background: var(--card-bg);
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    flex: 1 1 260px;
    max-width: 280px;
    text-align: center;

    display: flex;
    flex-direction: column;
    justify-content: space-between;

    animation: fadeUp 0.5s ease forwards;
    opacity: 0;
}

/* ANIMAÇÃO ENTRADA */
@keyframes fadeUp {
    from {
        opacity: 0;
        transform: translateY(15px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* BOTÃO */
.section-btn {
    position: relative;
    overflow: hidden;
    border: none;
    padding: 12px 18px;
    border-radius: 10px;
    color: #fff;
    font-weight: 600;
    cursor: pointer;
    width: 100%;

    transition: all 0.25s ease;
}

/* HOVER */
.section-btn:hover {
    transform: translateY(-3px) scale(1.03);
    filter: brightness(1.1);
}

/* CLICK */
.section-btn:active {
    transform: scale(0.97);
}

/* EFEITO BRILHO */
.section-btn::after {
    content: "";
    position: absolute;
    top: 0;
    left: -75%;
    width: 50%;
    height: 100%;
    background: linear-gradient(
        120deg,
        rgba(255,255,255,0.2),
        rgba(255,255,255,0.6),
        rgba(255,255,255,0.2)
    );
    transform: skewX(-20deg);
    transition: 0.6s;
}

.section-btn:hover::after {
    left: 120%;
}

a {
    text-decoration: none;
}

</style>
</head>

<body>

<div class="funnel-container">

    <!-- REEMBOLSO -->
    <div class="embedded-section" style="border-top: 4px solid var(--reembolso);">
        <div>
            <strong style="color: var(--reembolso);">🔄 REEMBOLSO HE/FALTAS</strong>
            <p>Solicite Reembolso em caso de faltas e descontos indevidos.</p>
        </div>
        <a href="https://forms.office.com/pages/responsepage.aspx?id=fCAtUtXsx0-nbxdGSxFh-f7MDqf4DUBBuOHjox7sxytUM1pLUFZVQjkxV1ZUNkY2RU1CWVQ1MVJZOS4u&route=shorturl" target="_blank">
            <button class="section-btn" style="background: var(--reembolso);">
                📝 Preencher Formulário
            </button>
        </a>
    </div>

    <!-- INATIVAÇÃO -->
    <div class="embedded-section" style="border-top: 4px solid var(--appsheet);">
        <div>
            <strong style="color: var(--appsheet);">📱 INATIVAÇÃO VOUCHER UBER</strong>
            <p>Inativação de usuários Uber em caso de desligamento.</p>
        </div>
        <button onclick="abrirAppSheet()" class="section-btn" style="background: var(--appsheet);">
            🚀 Abrir AppSheet
        </button>
    </div>

    <!-- GLPI -->
    <div class="embedded-section" style="border-top: 4px solid var(--glpi);">
        <div>
            <strong style="color: var(--glpi);">🛠️ CHAMADOS - GLPI</strong>
            <p>Abertura e consulta de chamados técnicos WeCanBR.</p>
        </div>
        <a href="https://glpi.wecanbr.com.br/index.php?noAUTO=1" target="_blank">
            <button class="section-btn" style="background: var(--glpi);">
                🎫 Acessar GLPI
            </button>
        </a>
    </div>

    <!-- PONTOMAIS -->
    <div class="embedded-section" style="border-top: 4px solid var(--pontomais);">
        <div>
            <strong style="color: var(--pontomais);">⏱️ PONTOMAIS</strong>
            <p>Gestão de colaboradores e conferência de ponto.</p>
        </div>
        <a href="https://app2.pontomais.com.br/controle-de-ponto/colaboradores/lista" target="_blank">
            <button class="section-btn" style="background: var(--pontomais);">
                🔍 Abrir Pontomais
            </button>
        </a>
    </div>

</div>

<script>
function abrirAppSheet() {
    window.open("SEU_LINK_APPSHEET_AQUI", "_blank");
}
</script>

</body>
</html>
