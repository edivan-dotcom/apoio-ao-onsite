<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apoio ao On-Site | WeCan</title>
    <style>
        :root {
            --primary: #ee4d2d; /* Laranja Shopee/WeCan */
            --bg: #f5f5f5;
            --text: #333;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); margin: 0; }
        
        /* Dashboard Discreto */
        .dash-bar {
            background: #fff; padding: 10px 20px; border-bottom: 1px solid #ddd;
            display: flex; align-items: center; gap: 20px; font-size: 14px; color: #666;
        }
        .status-badge { background: #eee; padding: 4px 10px; border-radius: 20px; font-weight: bold; }
        .status-alert { color: var(--primary); font-weight: bold; }

        /* Navegação */
        nav { background: #333; display: flex; padding: 0 10px; }
        nav button { 
            background: none; border: none; color: #fff; padding: 15px 20px; 
            cursor: pointer; border-bottom: 3px solid transparent;
        }
        nav button.active { border-bottom: 3px solid var(--primary); color: var(--primary); }

        /* Conteúdo */
        .tab-content { display: none; padding: 20px; max-width: 1000px; margin: auto; }
        .tab-content.active { display: block; }

        /* Cards do Onsite */
        .grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; }
        .card { 
            background: #fff; border-left: 5px solid #ccc; padding: 15px; 
            border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
        }
        .card.pendente { border-left-color: #f1c40f; }
        .card h4 { margin: 0 0 10px 0; display: flex; justify-content: space-between; }
        .btn-acao { 
            display: inline-block; margin-top: 10px; padding: 8px 12px; 
            background: var(--primary); color: #fff; text-decoration: none; 
            border-radius: 4px; font-size: 12px; border: none; cursor: pointer;
        }

        /* Formulário */
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; }
        .alerta-instrucao { background: #fff3cd; color: #856404; padding: 10px; border-radius: 4px; margin-top: 5px; font-size: 13px; display: none; }
    </style>
</head>
<body>

<div class="dash-bar" id="dashboard">
    <span>Solicitações Pendentes: <span id="total-pendentes" class="status-badge">0</span></span>
    <div id="onsites-alerta" style="display: flex; gap: 10px;">
        </div>
</div>

<nav>
    <button onclick="openTab('dashboard-home')" class="active" id="btn-dash">🏠 Início</button>
    <button onclick="openTab('solicitar')">📝 Solicitar Benefício</button>
    <button onclick="openTab('gestao')">📋 Meus Cards (Onsite)</button>
</nav>

<div id="dashboard-home" class="tab-content active">
    <h3>Bem-vindo ao Apoio On-site</h3>
    <p>Utilize as abas acima para gerenciar as solicitações de benefícios.</p>
</div>

<div id="solicitar" class="tab-content">
    <h3>Nova Solicitação</h3>
    <form id="formSolicitacao">
        <div class="form-group">
            <label>Matrícula (Apenas números):</label>
            <input type="text" id="matricula" placeholder="Ex: 769297" required>
        </div>
        <div class="form-group">
            <label>Tipo de Solicitação:</label>
            <select id="tipo" required onchange="atualizarOpcoes()">
                <option value="">Selecione...</option>
                <option value="TROCA DE BENEFICIO">TROCA DE BENEFICIO</option>
                <option value="AJUSTE VALOR DA PASSAGEM">AJUSTE VALOR DA PASSAGEM</option>
                <option value="PEDIDO DE DEMISSÃO">PEDIDO DE DEMISSÃO</option>
            </select>
        </div>
        <div class="form-group" id="group-beneficio">
            <label>Qual Benefício?</label>
            <select id="beneficio" onchange="verificarLogicaValor()">
                <option value="">Selecione...</option>
                <option value="VT para FRETADO">VT para FRETADO</option>
                <option value="FRETADO para VT">FRETADO para VT</option>
                <option value="para MOBILIDADE">... para MOBILIDADE</option>
                <option value="para VOUCHER UBER">... para VOUCHER UBER</option>
            </select>
        </div>

        <div class="form-group" id="group-valor" style="display:none;">
            <label id="label-valor">Valor VT:</label>
            <input type="number" id="valor_vt" step="0.01">
            <div id="instrucao-valor" class="alerta-instrucao"></div>
        </div>

        <div class="form-group" id="group-telefone" style="display:none;">
            <label>Telefone Atualizado (Para Voucher):</label>
            <input type="text" id="telefone" placeholder="(00) 00000-0000">
        </div>

        <button type="button" class="btn-acao" onclick="enviarDados()">Enviar Solicitação</button>
    </form>
</div>

<div id="gestao" class="tab-content">
    <div style="margin-bottom: 20px;">
        <label>Selecione seu nome para ver seus cards:</label>
        <select id="filtro-onsite" onchange="renderizarCards()">
            <option value="">Escolher Onsite...</option>
            <option value="Aline Santos">Aline Santos</option>
            <option value="Luis Pessanha">Luis Pessanha</option>
            </select>
    </div>
    <div class="grid-cards" id="container-cards">
        </div>
</div>

<script>
    const SCRIPT_URL = "SUA_URL_DO_APP_SCRIPT_AQUI";

    function openTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        event.currentTarget.classList.add('active');
        if(tabId === 'gestao' || tabId === 'dashboard-home') atualizarDashboard();
    }

    function verificarLogicaValor() {
        const beneficio = document.getElementById('beneficio').value;
        const divValor = document.getElementById('group-valor');
        const divTel = document.getElementById('group-telefone');
        const instrucao = document.getElementById('instrucao-valor');
        
        divValor.style.display = 'none';
        divTel.style.display = 'none';
        instrucao.style.display = 'none';

        if (beneficio.includes('para VT')) {
            divValor.style.display = 'block';
            instrucao.style.display = 'block';
            instrucao.innerHTML = "<strong>⚠️ Atenção:</strong> Informe o Gasto DIÁRIO TOTAL (Ida + Volta).";
        } else if (beneficio.includes('VOUCHER')) {
            divValor.style.display = 'block';
            divTel.style.display = 'block';
            instrucao.style.display = 'block';
            instrucao.innerHTML = "<strong>⚠️ Atenção:</strong> Informe o Valor de apenas UM TRECHO (Só Ida ou Só Volta).";
        } else if (beneficio.includes('MOBILIDADE')) {
            divValor.style.display = 'block';
            instrucao.style.display = 'block';
            instrucao.innerHTML = "ℹ️ Valor Fixo de Mobilidade: R$ 440,00.";
            document.getElementById('valor_vt').value = 440;
        }
    }

    async function enviarDados() {
        const data = {
            matricula: document.getElementById('matricula').value,
            tipo_solicitacao: document.getElementById('tipo').value,
            qual_beneficio: document.getElementById('beneficio').value,
            valor_vt: document.getElementById('valor_vt').value,
            telefone: document.getElementById('telefone').value
        };

        // Aqui vai o fetch para o seu App Script
        alert("Enviando solicitação para " + data.matricula);
        // Implementar o fetch(SCRIPT_URL, {method: 'POST'...})
    }

    async function atualizarDashboard() {
        // Fetch GET no App Script para pegar os totais
        // Atualiza o elemento 'total-pendentes' e 'onsites-alerta'
    }

</script>
</body>
</html>
