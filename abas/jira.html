<div class="gestao-section">
    <h2 style="text-align: center; color: var(--jira);">🎫 Tickets Shopee por On-Site</h2>
    <p style="text-align: center; color: #666; font-size: 0.9rem;">Selecione o seu nome para visualizar as pendências do JIRA sob sua gestão.</p>
    
    <div id="viewAgrupadaJira" class="grid-gestao">
        <p style="text-align: center; width: 100%;">Carregando tickets do JIRA...</p>
    </div>
    
    <div id="viewDetalhadaJira" style="display: none; background: var(--card-bg); padding: 25px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); margin-top: 20px;">
        <button onclick="voltarParaAgrupamentoJira()" style="margin-bottom: 20px; padding: 10px 20px; border-radius: 5px; background: #666; color: white; border: none; cursor: pointer; font-weight: bold;">← Voltar para a lista</button>
        <h3 id="tituloOperacaoJira" style="color: var(--jira); margin-top: 0; text-align: center; font-size: 1.5rem;"></h3>
        
        <div id="containerFiltrosJira" style="display: flex; justify-content: center; gap: 10px; margin-top: 15px; margin-bottom: 25px; flex-wrap: wrap;"></div>

        <hr style="opacity: 0.2; margin-bottom: 30px;">
        
        <div id="containerCardsJira" class="grid-gestao"></div>
    </div>
</div>
