<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tickets Shopee | WeCanBR</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div style="font-weight: bold; color: var(--primary);">WE CAN BR</div>
        <div class="nav-links">
            <a href="../index.html" class="login-btn">🏠 Voltar para Home</a>
        </div>
    </nav>

    <header>
        <h1 id="tituloPagina">TICKETS SHOPEE - GERAL</h1>
    </header>

    <div class="container" id="containerPrincipalJira">
        <p style="text-align:center; width: 100%;">Carregando painel de Onsites...</p>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxupjNwDDgxLULbLOPUVd2jc4hRUxI9JYYeqy7riYGBg5ymoqAfLeJn6IwRqLH7aozH/exec";
        let todosTickets = [];

        async function carregarDados() {
            try {
                const res = await fetch(SCRIPT_URL);
                const dados = await res.json();
                todosTickets = dados.jira;
                mostrarPainelGeral();
            } catch (e) {
                console.error("Erro ao carregar dados:", e);
            }
        }

        // 1. VISÃO INICIAL: CARDS DOS ONSITES
        function mostrarPainelGeral() {
            const container = document.getElementById('containerPrincipalJira');
            document.getElementById('tituloPagina').innerText = "TICKETS SHOPEE - GERAL";
            container.innerHTML = "";

            const contagem = {};
            todosTickets.forEach(t => {
                let ons = t.onsite || "Não Mapeado";
                contagem[ons] = (contagem[ons] || 0) + 1;
            });

            for (const [onsite, qtd] of Object.entries(contagem)) {
                container.innerHTML += `
                    <div class="card-jira-agrupado" onclick="mostrarDetalhesOnsite('${onsite}')">
                        <span style="font-size: 30px;">🧑‍💻</span>
                        <h3 style="color: var(--primary);">${onsite}</h3>
                        <span style="font-weight: bold; color: var(--danger);">${qtd} Ticket(s) Pendente(s)</span>
                    </div>`;
            }
        }

        // 2. VISÃO DETALHADA: TICKETS + FILTROS DENTRO DO ONSITE
        function mostrarDetalhesOnsite(onsite, filtroAtivo = 'TODOS') {
            const container = document.getElementById('containerPrincipalJira');
            document.getElementById('tituloPagina').innerText = `Gestão: ${onsite}`;
            
            let htmlBase = `
                <div style="grid-column: 1 / -1; width: 100%;">
                    <button onclick="mostrarPainelGeral()" style="margin-bottom:20px; cursor:pointer; background:none; border:none; color:var(--primary); font-weight:bold;">⬅️ Voltar ao Painel Geral</button>
                    <div class="tabs-container" style="margin-bottom: 25px;">
                        <button class="tab-btn ${filtroAtivo === 'TODOS' ? 'active' : ''}" onclick="mostrarDetalhesOnsite('${onsite}', 'TODOS')">TUDO</button>
                        <button class="tab-btn ${filtroAtivo === 'DESLIGAMENTO' ? 'active' : ''}" onclick="mostrarDetalhesOnsite('${onsite}', 'DESLIGAMENTO')">🚫 DESLIGAMENTOS</button>
                        <button class="tab-btn ${filtroAtivo === 'MOVIMENTACAO' ? 'active' : ''}" onclick="mostrarDetalhesOnsite('${onsite}', 'MOVIMENTACAO')">🔄 MOVIMENTAÇÕES</button>
                    </div>
                </div>
            `;
            container.innerHTML = htmlBase;

            let tickets = todosTickets.filter(t => t.onsite === onsite);
            
            // Ajuste no Filtro: Busca por variações da palavra
            if(filtroAtivo === 'DESLIGAMENTO') {
                tickets = tickets.filter(t => t.resumo.toUpperCase().includes("DESLIGAMENTO"));
            } else if(filtroAtivo === 'MOVIMENTACAO') {
                tickets = tickets.filter(t => t.resumo.toUpperCase().includes("MOVIMENTAÇ") || t.resumo.toUpperCase().includes("MOVIMENTAC"));
            }

            tickets.forEach(t => {
                const resumo = t.resumo.toUpperCase();
                const isDesligamento = resumo.includes("DESLIGAMENTO");
                const isMovimentacao = resumo.includes("MOVIMENTAÇ") || resumo.includes("MOVIMENTAC");
                
                let classeDestaque = isDesligamento ? "card-desligamento" : (isMovimentacao ? "card-movimentacao" : "");
                
                let botoesExtras = "";
                const linkFormsDesligamento = "https://forms.office.com/Pages/ResponsePage.aspx?id=fCAtUtXsx0-nbxdGSxFh-f7MDqf4DUBBuOHjox7sxytUNFFQNTgzR1pQV0FLM05aWElXSjlRMjFHRy4u&origin=Invitation&channel=0";
                const linkFormsMovimentacao = "https://forms.office.com/Pages/ResponsePage.aspx?id=fCAtUtXsx0-nbxdGSxFh-eVAzhwdpsxLmCSGMQwqNIpUM1E2TFRSRkhNWU9IQk9SVFhBSDJNWTFDVS4u";

                if (isDesligamento) {
                    botoesExtras = `<button class="btn-jira-link btn-forms-desligamento" onclick="abrirPopup('${linkFormsDesligamento}')">📋 ENVIAR FORMS DE DESLIGAMENTO</button>`;
                } else if (isMovimentacao) {
                    botoesExtras = `
                        <button class="btn-jira-link btn-central-solicitacao" onclick="abrirPopup('${linkFormsMovimentacao}')">📥 CENTRAL DE SOLICITAÇÕES</button>
                        <button onclick="enviarParaPonto('${t.chave}')" class="btn-jira-link" style="background: #f1c40f; color:#000; padding: 8px;">➡️ ENVIAR PARA O PONTO</button>
                    `;
                } else {
                    botoesExtras = `<button onclick="enviarParaPonto('${t.chave}')" class="btn-jira-link" style="background: #f1c40f; color:#000; padding: 8px;">➡️ ENVIAR PARA O PONTO</button>`;
                }

                container.innerHTML += `
                    <div class="card ${classeDestaque}" style="padding-bottom: 160px; position:relative;">
                        <strong>${t.nome}</strong><br><small>${t.chave}</small><br>
                        <hr style="opacity:0.1">
                        <p style="font-size:0.9rem;">${t.resumo}</p>
                        <div style="position: absolute; bottom: 15px; left: 15px; right: 15px; display: flex; flex-direction: column; gap: 5px;">
                            <a href="https://spxresolve.atlassian.net/browse/${t.chave}" target="_blank" class="btn-jira-link" style="background: var(--jira); padding: 8px;">🔗 ABRIR JIRA</a>
                            ${botoesExtras}
                        </div>
                    </div>`;
            });
        }

        // Função para abrir os Forms em Pop-up
        function abrirPopup(url) {
            const largura = 900;
            const altura = 800;
            const esquerda = (screen.width - largura) / 2;
            const topo = (screen.height - altura) / 2;
            window.open(url, 'MicrosoftForms', `width=${largura},height=${altura},top=${topo},left=${esquerda},scrollbars=yes,resizable=yes`);
        }

        window.onload = carregarDados;
    </script>
</body>
</html>
